[package]
name = "fossil-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "0.16.0", features = ["server"] }
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
schemars = "1.2"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
zeroize = "1"
# Compile-time cap: ureq-proto logs raw request bytes (bearer, assertion) at
# TRACE and ureq logs headers at DEBUG, with no feature to turn that off.
# `max_level_info` makes every log! below INFO a no-op in the whole build, so
# the cap holds for any logger an embedding application installs.
log = { version = "0.4", features = ["max_level_info"] }

[dev-dependencies]
proptest = "1.4"
tempfile = "3.8"
